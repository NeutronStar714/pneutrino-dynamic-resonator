name: Publish Dynamic Resonator 1.3.0 once

# One-time publication of the version requested by the repository owner.
# The fixed previous-commit guard prevents later pushes from running this job.
# This temporary workflow is removed after the release has been published.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.before == 'b0763ed2a541d9d698d4a5c2acbdc68e12ad7f5f'
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Read version and check for an existing release
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(DynamicResonator VERSION (\d+\.\d+\.\d+)\)') { throw 'Project version not found' }
          $version = '1.3.0'
          if ($Matches[1] -ne $version) { throw 'This one-time workflow only releases version 1.3.0' }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100
          if ($LASTEXITCODE -ne 0) { throw 'Could not list repository releases' }
          $exists = @($releases | ConvertFrom-Json | ForEach-Object { $_.tagName }) -contains "v$version"
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Configure
        if: steps.version.outputs.exists != 'true'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and standalone
        if: steps.version.outputs.exists != 'true'
        run: cmake --build build --config Release --target DynamicResonator_VST3 DynamicResonator_Standalone --parallel 1 -- /nodeReuse:false

      - name: Package binaries and demo
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/standalone, dist/vst3 | Out-Null
          Copy-Item 'build/DynamicResonator_artefacts/Release/Standalone/Dynamic Resonator.exe' dist/standalone/
          Copy-Item 'build/DynamicResonator_artefacts/Release/VST3/Dynamic Resonator.vst3' dist/vst3/ -Recurse
          foreach ($folder in @('dist/standalone', 'dist/vst3')) {
            Copy-Item LICENSE $folder
            Copy-Item THIRD_PARTY_NOTICES.md $folder
            Copy-Item external/JUCE/LICENSE.md "$folder/JUCE-LICENSE.md"
            Copy-Item release/README-Windows.txt "$folder/README.txt"
          }
          Compress-Archive -Path 'dist/standalone/*' -DestinationPath "dist/DynamicResonator-$env:VERSION-Windows-x64-Standalone.zip"
          Compress-Archive -Path 'dist/vst3/*' -DestinationPath "dist/DynamicResonator-$env:VERSION-Windows-x64-VST3.zip"
          Copy-Item assets/pr-rec-dynres.mp3 dist/pr-rec-dynres.mp3
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.mp3' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Create tag and publish release
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $env:TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dynamic Resonator $env:VERSION" --notes-file release/NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed' }
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($release.assets.Count -ne 4) { throw 'Expected two ZIPs, the audio demo, and checksums before publication' }
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
